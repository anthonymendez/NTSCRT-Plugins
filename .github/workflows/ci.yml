# Build + test the core, tools and plug-ins on Windows (MSVC) and macOS (universal),
# package the OpenFX bundles, and build the Final Cut Pro FxPlug plug-in when the
# FXPLUG_SDK_URL secret is configured (see fxplug/README.md). A vX.Y.Z / vX.Y.Z-rc.N tag
# also publishes a GitHub Release (job "release", see docs/RELEASING.md).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]   # a version tag also publishes a GitHub Release (job "release")
    # Docs-only pushes don't build. GitHub never evaluates path filters for tag pushes,
    # so a release tag always runs, whatever it changed. docs/dev/port-map.json is data the
    # sync-check job reads (scripts/check_sync.py), so a change to it still runs CI; the
    # later, positive pattern wins over "!docs/**".
    paths: ["**", "!**.md", "!docs/**", "docs/dev/port-map.json"]
  pull_request:
    paths: ["**", "!**.md", "!docs/**", "docs/dev/port-map.json"]
  workflow_dispatch:   # also how to run CI on a branch: gh workflow run ci --ref <branch>

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR / branch runs are cancelled; main and tags always run to the end
  # (main's runs fill the caches that tag runs restore).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: windows (MSVC, Release)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # top-level submodules only (vendor/*, upstream/NTSCRT); upstream's own nested
          # submodules are only needed by the golden workflow
          submodules: true

      # Toolchain pinned in rust-toolchain.toml; the Rust cache key includes its version.
      - name: Rust (rust-toolchain.toml, x86_64-pc-windows-msvc)
        id: rust
        shell: bash
        run: |
          tc="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$tc" --profile minimal --target x86_64-pc-windows-msvc
          rustc --version && cargo --version
          echo "rustc=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "subs=$(git ls-tree HEAD vendor/librashader vendor/ntsc-rs | awk '{print substr($3,1,12)}' | paste -sd- -)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + FetchContent
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/_deps
          key: win-deps-${{ hashFiles('cmake/*.cmake', 'ofx/CMakeLists.txt', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: win-deps-

      # Rust build outputs (librashader + ntsc-rs: ~6 of the ~9 build minutes). Keyed on the
      # exact inputs; a fallback restore only reuses compiled third-party crates (cargo
      # rebuilds anything whose sources or rustc changed). Saved by main / dispatched runs,
      # restored by tags and PRs (they can read main's caches).
      - name: Restore Rust target dirs
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/librashader-target
            build/cargo-ntscrs
          key: win-rust-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.subs }}-${{ hashFiles('rust/**', 'rust-toolchain.toml', 'core/stages/crt/CMakeLists.txt') }}
          restore-keys: win-rust-${{ steps.rust.outputs.rustc }}-

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release -- -m

      - name: Save Rust target dirs
        if: steps.rust-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            build/librashader-target
            build/cargo-ntscrs
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Test
        env:
          NTSCRT_REQUIRE_GPU: "1"   # a missing D3D11 device fails the GPU tests instead of skipping them
        run: ctest --test-dir build -C Release --output-on-failure -LE golden

      # Golden images (docs/TESTING.md): upstream crt-smoke references and self-references,
      # verbose so every comparison's numbers are in the log. Strict: a missing reference fails.
      - name: Golden images
        if: success() || failure()
        env:
          NTSCRT_REQUIRE_GPU: "1"
          NTSCRT_GOLDEN_STRICT: "1"
        run: ctest --test-dir build -C Release -V -L golden

      - name: Check FxPlug parameter IDs cover the schema
        run: python fxplug/tools/update_param_ids.py --check

      - name: Package OFX bundle
        shell: bash
        run: |
          strict=""; [ -f ofx/CMakeLists.txt ] || strict="--allow-empty"
          extra=("ofx/Install NTSCRT.cmd" install.ps1 README.md)
          for f in LICENSE THIRD_PARTY_NOTICES.md; do if [ -e "$f" ]; then extra+=("$f"); fi; done
          python scripts/ci/package_bundles.py --build build --ext .ofx.bundle --out dist/NTSCRT-OFX-windows-x64.zip $strict --extra "${extra[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: NTSCRT-OFX-windows-x64
          path: dist/*.zip
          if-no-files-found: warn

      # install.ps1's download path: serve the zip + a SHA256SUMS over local HTTP (-BaseUrl),
      # install into a temp folder, then check that a tampered zip is refused, that a release
      # without SHA256SUMS is refused, and that the pre-checksum v0.4.0 installs with a warning.
      - name: Smoke-test install.ps1 (checksum verified, tampered zip / missing SHA256SUMS refused)
        if: hashFiles('dist/NTSCRT-OFX-windows-x64.zip') != ''
        shell: pwsh
        run: |
          $zipName = "NTSCRT-OFX-windows-x64.zip"
          $srv = Join-Path $env:RUNNER_TEMP "srv"; $bad = Join-Path $env:RUNNER_TEMP "srv-bad"
          $nosums = Join-Path $env:RUNNER_TEMP "srv-nosums"
          New-Item -ItemType Directory -Force $srv, $bad, $nosums | Out-Null
          Copy-Item "dist/$zipName" $srv
          Copy-Item "dist/$zipName" $nosums
          $h = (Get-FileHash "$srv/$zipName" -Algorithm SHA256).Hash.ToLower()
          "$h  $zipName" | Set-Content -Encoding ascii "$srv/SHA256SUMS"
          Copy-Item "$srv/SHA256SUMS" $bad
          $bytes = [IO.File]::ReadAllBytes("$srv/$zipName"); $bytes[100] = $bytes[100] -bxor 0xff
          [IO.File]::WriteAllBytes("$bad/$zipName", $bytes)
          $py = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            Start-Sleep 2
            $dest = Join-Path $env:RUNNER_TEMP "ofx-test"
            ./install.ps1 -BaseUrl "http://127.0.0.1:8765/srv" -Dest $dest
            if (-not (Test-Path "$dest/NTSCRT.ofx.bundle/Contents/Win64/NTSCRT.ofx")) { throw "install.ps1 didn't install the bundle" }
            $dest2 = Join-Path $env:RUNNER_TEMP "ofx-test-bad"
            $failed = $false
            try { ./install.ps1 -BaseUrl "http://127.0.0.1:8765/srv-bad" -Dest $dest2 } catch { $failed = $true; Write-Host "refused as expected: $_" }
            if (-not $failed) { throw "install.ps1 accepted a tampered zip" }
            if (Test-Path "$dest2/NTSCRT.ofx.bundle") { throw "the tampered bundle was installed" }
            # No SHA256SUMS: refused for a normal release (and for an unresolved "latest") ...
            foreach ($v in "v9.9.9", "latest") {
              $dest3 = Join-Path $env:RUNNER_TEMP "ofx-test-nosums-$v"
              $failed = $false
              try { ./install.ps1 -BaseUrl "http://127.0.0.1:8765/srv-nosums" -Version $v -Dest $dest3 } catch { $failed = $true; Write-Host "refused as expected: $_" }
              if (-not $failed) { throw "install.ps1 installed $v without SHA256SUMS" }
              if (Test-Path "$dest3/NTSCRT.ofx.bundle") { throw "the unverified $v bundle was installed" }
            }
            # ... but v0.4.0, published before checksums existed, installs with a warning.
            $dest4 = Join-Path $env:RUNNER_TEMP "ofx-test-legacy"
            $log = ./install.ps1 -BaseUrl "http://127.0.0.1:8765/srv-nosums" -Version v0.4.0 -Dest $dest4 3>&1 | Out-String
            Write-Host $log
            if ($log -notmatch "predates checksums") { throw "no pre-checksum warning for v0.4.0" }
            if (-not (Test-Path "$dest4/NTSCRT.ofx.bundle/Contents/Win64/NTSCRT.ofx")) { throw "install.ps1 refused the pre-checksum v0.4.0" }
            ./install.ps1 -Uninstall -Dest $dest4
            ./install.ps1 -Uninstall -Dest $dest
            if (Test-Path "$dest/NTSCRT.ofx.bundle") { throw "uninstall left the bundle" }
            Write-Host "install.ps1 checksum verification OK"
          } finally { Stop-Process -Id $py.Id -ErrorAction SilentlyContinue }

      # MSI that runs install.ps1 (downloads the latest release when users run it).
      - name: Build MSI installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          ./installer/windows/build-msi.ps1 -Out dist/installer/NTSCRT-Installer-windows.msi

      # The runner is admin, so msiexec runs without a prompt. NTSCRT_FROM points the
      # script at the zip built above instead of the latest published release.
      - name: Smoke-test MSI (install + uninstall)
        if: hashFiles('dist/NTSCRT-OFX-windows-x64.zip') != ''
        run: |
          $msi = (Resolve-Path dist/installer/NTSCRT-Installer-windows.msi).Path
          $zip = (Resolve-Path dist/NTSCRT-OFX-windows-x64.zip).Path
          $bundle = Join-Path $env:CommonProgramFiles "OFX\Plugins\NTSCRT.ofx.bundle"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i", "`"$msi`"", "/qn", "NTSCRT_FROM=`"$zip`"", "/l*v", "msi-install.log"
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 80; throw "msiexec /i exit $($p.ExitCode)" }
          Select-String -Path msi-install.log -Pattern "==>" | ForEach-Object { $_.Line }
          if (-not (Test-Path (Join-Path $bundle "Contents\Win64\NTSCRT.ofx"))) { throw "bundle not installed: $bundle" }
          Get-Content (Join-Path $bundle "Contents\Resources\VERSION")
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/x", "`"$msi`"", "/qn", "/l*v", "msi-uninstall.log"
          if ($p.ExitCode -ne 0) { Get-Content msi-uninstall.log -Tail 80; throw "msiexec /x exit $($p.ExitCode)" }
          if (Test-Path $bundle) { throw "bundle still installed after uninstall: $bundle" }
          if (Test-Path (Join-Path ${env:ProgramFiles} "NTSCRT Installer\install.ps1")) { throw "installer files left behind" }
          Write-Host "MSI install + uninstall OK"

      - uses: actions/upload-artifact@v7
        with:
          name: NTSCRT-Installer-windows
          path: dist/installer/NTSCRT-Installer-windows.msi

      - name: Upload MSI logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: msi-*.log
          if-no-files-found: ignore

      - name: Upload golden mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-mismatch-windows
          path: build/tests/golden/golden-out
          if-no-files-found: ignore

  macos:
    name: macos (universal, Release)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Fails the job when the runner has no usable Metal device, which is what makes
      # NTSCRT_REQUIRE_GPU below safe (macos-15 runners expose "Apple Paravirtual device").
      - name: Metal available?
        run: xcrun swift scripts/ci/metal_check.swift

      - name: Rust (rust-toolchain.toml, aarch64 + x86_64)
        id: rust
        run: |
          tc="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$tc" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustc --version && cargo --version
          echo "rustc=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "subs=$(git ls-tree HEAD vendor/librashader vendor/ntsc-rs | awk '{print substr($3,1,12)}' | paste -sd- -)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + FetchContent
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/_deps
          key: mac-deps-${{ hashFiles('cmake/*.cmake', 'ofx/CMakeLists.txt', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: mac-deps-

      - name: Restore Rust target dirs
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/librashader-target
            build/cargo-ntscrs
          key: mac-rust-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.subs }}-${{ hashFiles('rust/**', 'rust-toolchain.toml', 'core/stages/crt/CMakeLists.txt') }}
          restore-keys: mac-rust-${{ steps.rust.outputs.rustc }}-

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      # The Final Cut plug-in only builds with Apple's FxPlug SDK (the fxplug job, when its secret
      # is set): without it, at least compile its Objective-C++ against stub headers declaring the
      # documented FxPlug 4 API, to catch typos and C++ errors.
      - name: Syntax-check FxPlug sources (stub SDK headers)
        run: bash fxplug/tests/stubs/syntax_check.sh build

      - name: Save Rust target dirs
        if: steps.rust-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v6
        with:
          path: |
            build/librashader-target
            build/cargo-ntscrs
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # Golden first: once a shader hangs the VM's paravirtual GPU (test_crt's crt-sim), later
      # processes' Metal work tends to hang too, and the golden renders are the ones worth having.
      - name: Golden images
        env:
          NTSCRT_REQUIRE_GPU: "1"
          NTSCRT_GOLDEN_STRICT: "1"
        run: ctest --test-dir build -V -L golden

      - name: Test
        if: success() || failure()
        env:
          NTSCRT_REQUIRE_GPU: "1"   # a missing Metal device fails the GPU tests instead of skipping them
        run: ctest --test-dir build --output-on-failure -LE golden

      - name: Package OFX bundle (universal)
        shell: bash
        run: |
          strict=""; [ -f ofx/CMakeLists.txt ] || strict="--allow-empty"
          find build -name '*.ofx' -type f -path '*.ofx.bundle/*' -exec sh -c 'echo "$1: $(lipo -archs "$1")"' _ {} \;
          extra=(install.sh README.md)
          for f in LICENSE THIRD_PARTY_NOTICES.md; do if [ -e "$f" ]; then extra+=("$f"); fi; done
          python3 scripts/ci/package_bundles.py --build build --ext .ofx.bundle --out dist/NTSCRT-OFX-macos-universal.zip $strict --extra "${extra[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: NTSCRT-OFX-macos-universal
          path: dist/*.zip
          if-no-files-found: warn

      # Payload-free .pkg whose postinstall runs install.sh (latest release at run time).
      - name: Build .pkg installer
        run: sh installer/macos/build-pkg.sh dist/installer/NTSCRT-Installer-macos.pkg

      # `installer -pkg` can't pass --from, so run the built pkg's own postinstall
      # (as root, like Installer does) with NTSCRT_FROM = the zip built above.
      - name: Smoke-test .pkg postinstall
        if: hashFiles('dist/NTSCRT-OFX-macos-universal.zip') != ''
        run: |
          x="$RUNNER_TEMP/pkg-x"; rm -rf "$x"
          pkgutil --expand-full dist/installer/NTSCRT-Installer-macos.pkg "$x"
          ls -R "$x"
          post="$(find "$x" -name postinstall -path '*Scripts*' | head -n 1)"
          [ -n "$post" ] && [ -f "$(dirname "$post")/install.sh" ] || { echo "::error::postinstall/install.sh missing in pkg"; exit 1; }
          sudo NTSCRT_FROM="$PWD/dist/NTSCRT-OFX-macos-universal.zip" sh "$post"
          test -f /Library/OFX/Plugins/NTSCRT.ofx.bundle/Contents/MacOS/NTSCRT.ofx
          cat /Library/OFX/Plugins/NTSCRT.ofx.bundle/Contents/Resources/VERSION
          sudo test -s /Library/Logs/NTSCRT/install.log
          sudo tail -n 5 /Library/Logs/NTSCRT/install.log
          if sudo NTSCRT_VERSION='v1;x' sh "$post"; then echo "::error::postinstall accepted a bad NTSCRT_VERSION"; exit 1; fi
          # no --resolve / --fcp: removes whatever is installed, even with no Resolve app present
          sudo sh install.sh --uninstall
          test ! -e /Library/OFX/Plugins/NTSCRT.ofx.bundle

      # install.sh's download path: serve the zip + SHA256SUMS over local HTTP (--base-url),
      # install, then check that a tampered zip and a release without SHA256SUMS are refused (the
      # installed copy untouched), and that the pre-checksum v0.4.0 installs with a warning.
      - name: Smoke-test install.sh (checksum verified, tampered zip / missing SHA256SUMS refused)
        if: hashFiles('dist/NTSCRT-OFX-macos-universal.zip') != ''
        run: |
          zipname=NTSCRT-OFX-macos-universal.zip
          srv="$RUNNER_TEMP/srv"; bad="$RUNNER_TEMP/srv-bad"; nosums="$RUNNER_TEMP/srv-nosums"
          mkdir -p "$srv" "$bad" "$nosums"
          cp "dist/$zipname" "$srv/"
          cp "dist/$zipname" "$nosums/"
          (cd "$srv" && shasum -a 256 "$zipname" > SHA256SUMS)
          cp "$srv/SHA256SUMS" "$bad/"
          python3 -c 'import sys; b = bytearray(open(sys.argv[1], "rb").read()); b[100] ^= 0xFF; open(sys.argv[2], "wb").write(b)' "$srv/$zipname" "$bad/$zipname"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP" >/dev/null 2>&1 &
          srv_pid=$!; trap 'kill $srv_pid' EXIT; sleep 2
          sudo sh install.sh --resolve --base-url "http://127.0.0.1:8765/srv"
          test -f /Library/OFX/Plugins/NTSCRT.ofx.bundle/Contents/MacOS/NTSCRT.ofx
          before="$(sudo find /Library/OFX/Plugins/NTSCRT.ofx.bundle -type f -exec shasum {} + | shasum)"
          if sudo sh install.sh --resolve --base-url "http://127.0.0.1:8765/srv-bad"; then
            echo "::error::install.sh accepted a tampered zip"; exit 1
          fi
          after="$(sudo find /Library/OFX/Plugins/NTSCRT.ofx.bundle -type f -exec shasum {} + | shasum)"
          [ "$before" = "$after" ] || { echo "::error::the refused install changed the installed bundle"; exit 1; }
          # No SHA256SUMS: refused for a normal release (and for an unresolved "latest") ...
          for v in v9.9.9 latest; do
            if sudo sh install.sh --resolve --version "$v" --base-url "http://127.0.0.1:8765/srv-nosums"; then
              echo "::error::install.sh installed $v without SHA256SUMS"; exit 1
            fi
          done
          after="$(sudo find /Library/OFX/Plugins/NTSCRT.ofx.bundle -type f -exec shasum {} + | shasum)"
          [ "$before" = "$after" ] || { echo "::error::a refused install changed the installed bundle"; exit 1; }
          # ... but v0.4.0, published before checksums existed, installs with a warning.
          sudo sh install.sh --resolve --uninstall
          sudo sh install.sh --resolve --version v0.4.0 --base-url "http://127.0.0.1:8765/srv-nosums" 2>&1 | tee "$RUNNER_TEMP/legacy.log"
          grep -q "predates checksums" "$RUNNER_TEMP/legacy.log" || { echo "::error::no pre-checksum warning for v0.4.0"; exit 1; }
          test -f /Library/OFX/Plugins/NTSCRT.ofx.bundle/Contents/MacOS/NTSCRT.ofx
          sudo sh install.sh --resolve --uninstall
          test ! -e /Library/OFX/Plugins/NTSCRT.ofx.bundle
          echo "install.sh checksum verification OK"

      - uses: actions/upload-artifact@v7
        with:
          name: NTSCRT-Installer-macos
          path: dist/installer/NTSCRT-Installer-macos.pkg

      - name: Upload golden mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-mismatch-macos
          path: build/tests/golden/golden-out
          if-no-files-found: ignore

  # Independent of the macos job (it builds its own tree), so the two run in parallel.
  fxplug:
    name: fxplug (Final Cut Pro, universal)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Secrets can't be used in job-level `if:`; expose it to steps instead.
      FXPLUG_SDK_URL: ${{ secrets.FXPLUG_SDK_URL }}
      FXPLUG_SDK_SHA256: ${{ secrets.FXPLUG_SDK_SHA256 }}
    steps:
      - name: FxPlug SDK configured?
        id: sdk
        run: |
          if [ -n "$FXPLUG_SDK_URL" ]; then
            if [ -z "$FXPLUG_SDK_SHA256" ]; then
              echo "::error title=FxPlug SDK not pinned::FXPLUG_SDK_URL is set but FXPLUG_SDK_SHA256 is not. Add the SDK file's SHA-256 (shasum -a 256) as a repository secret (fxplug/README.md, CI section)."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=FxPlug skipped::Repository secret FXPLUG_SDK_URL is not set, so the Final Cut Pro plug-in was not built. See fxplug/README.md (CI section) to enable it."
          fi

      - uses: actions/checkout@v7
        if: steps.sdk.outputs.available == 'true'
        with:
          submodules: true

      - name: Install FxPlug SDK
        if: steps.sdk.outputs.available == 'true'
        run: bash scripts/ci/install_fxplug_sdk.sh

      - name: Rust (rust-toolchain.toml, aarch64 + x86_64)
        id: rust
        if: steps.sdk.outputs.available == 'true'
        run: |
          tc="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$tc" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          echo "rustc=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "subs=$(git ls-tree HEAD vendor/librashader vendor/ntsc-rs | awk '{print substr($3,1,12)}' | paste -sd- -)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo + FetchContent
        if: steps.sdk.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/_deps
          key: mac-deps-${{ hashFiles('cmake/*.cmake', 'ofx/CMakeLists.txt', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: mac-deps-

      # Same cargo builds as the macos job: reuse (read-only) the target dirs it saves.
      - name: Restore Rust target dirs
        if: steps.sdk.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            build/librashader-target
            build/cargo-ntscrs
          key: mac-rust-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.subs }}-${{ hashFiles('rust/**', 'rust-toolchain.toml', 'core/stages/crt/CMakeLists.txt') }}
          restore-keys: mac-rust-${{ steps.rust.outputs.rustc }}-

      - name: Configure
        if: steps.sdk.outputs.available == 'true'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DNTSCRT_BUILD_FXPLUG=ON -DNTSCRT_BUILD_TESTS=OFF
          -DNTSCRT_FXPLUG_SDK_DIR=/Library/Developer

      - name: Build FxPlug bundle
        if: steps.sdk.outputs.available == 'true'
        run: |
          grep -q 'NTSCRT_FXPLUG_FRAMEWORK_DIR:PATH=.*Frameworks' build/CMakeCache.txt || {
            echo "::error::CMake did not find FxPlug.framework (see configure log)"; exit 1; }
          cmake --build build --target ntscrt_fxplug --parallel "$(sysctl -n hw.ncpu)"

      - name: Verify bundle
        if: steps.sdk.outputs.available == 'true'
        run: |
          app=build/fxplug/dist/NTSCRT.app
          pk="$app/Contents/PlugIns/NTSCRT Renderer.pluginkit"
          plutil -lint "$app/Contents/Info.plist" "$pk/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$pk/Contents/Info.plist")" = 'XPC!'
          test -f "$app/Contents/Resources/Motion Templates/NTSCRT/NTSCRT.moef"
          xmllint --noout "$app/Contents/Resources/Motion Templates/NTSCRT/NTSCRT.moef"
          archs="$(lipo -archs "$pk/Contents/MacOS/NTSCRTRenderer")"; echo "renderer: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::renderer is not universal ($archs)"; exit 1;; esac
          otool -L "$pk/Contents/MacOS/NTSCRTRenderer"
          otool -l "$pk/Contents/MacOS/NTSCRTRenderer" | grep -A2 LC_RPATH
          for fw in FxPlug PluginManager; do test -d "$pk/Contents/Frameworks/$fw.framework"; done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$pk"

      # NTSCRT.app plus the licence files (when the repo has them) at the zip root.
      - name: Zip
        if: steps.sdk.outputs.available == 'true'
        run: |
          stage="$RUNNER_TEMP/fxzip"; rm -rf "$stage"; mkdir -p dist "$stage"
          ditto build/fxplug/dist/NTSCRT.app "$stage/NTSCRT.app"
          for f in LICENSE THIRD_PARTY_NOTICES.md; do if [ -e "$f" ]; then ditto "$f" "$stage/$f"; fi; done
          ditto -c -k --sequesterRsrc "$stage" dist/NTSCRT-FxPlug-macos-universal.zip

      - uses: actions/upload-artifact@v7
        if: steps.sdk.outputs.available == 'true'
        with:
          name: NTSCRT-FxPlug-macos-universal
          path: dist/NTSCRT-FxPlug-macos-universal.zip

  # Lint the install / CI scripts (a minute; runs beside the builds).
  lint:
    name: lint (shellcheck, PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          shellcheck --version
          # tracked *.sh plus extension-less sh/bash scripts (pkg postinstall); submodules aren't checked out
          mapfile -t files < <(git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              *.sh) echo "$f" ;;
              *.*) ;;
              *) [ -f "$f" ] && head -n 1 "$f" | grep -qE '^#!(/bin/|/usr/bin/env )(ba)?sh' && echo "$f" ;;
            esac
          done)
          printf '%s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

      - name: PSScriptAnalyzer
        if: success() || failure()   # run even when shellcheck found something
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          # Excluded rules: Write-Host is the scripts' console UI (coloured "==>" lines), not pipeline
          # output; PSReviewUnusedParameter flags script parameters that are only read inside
          # functions (a known false positive; install.ps1); ShouldProcess (-WhatIf) doesn't
          # apply to these one-shot scripts' internal New-* helpers.
          $exclude = 'PSAvoidUsingWriteHost', 'PSReviewUnusedParameter', 'PSUseShouldProcessForStateChangingFunctions'
          $r = @(git ls-files '*.ps1' | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error -ExcludeRule $exclude
          })
          $r | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 300 | Write-Host
          if ($r.Count) { throw "PSScriptAnalyzer: $($r.Count) finding(s)" }

  # The port matches the upstream NTSCRT commit it's pinned at (scripts/check_sync.py): the
  # schema regenerates identically, presets are upstream's bytes, the golden refs, schema and
  # vendor pins (slang-shaders, ntsc-rs, librashader) agree, and docs/dev/port-map.json maps every
  # upstream file. Needs only upstream/NTSCRT and vendor/slang-shaders (gen_schema.py reads the
  # committed core/params/ntsc_descriptors.json, so no Rust). A Dependabot upstream/NTSCRT bump
  # fails here until the sync is done (docs/dev/UPSTREAM-SYNC.md).
  sync-check:
    name: sync-check (upstream NTSCRT pin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Submodules (upstream/NTSCRT, vendor/slang-shaders)
        run: git submodule update --init --depth 1 upstream/NTSCRT vendor/slang-shaders

      - name: Check sync with upstream
        run: python3 scripts/check_sync.py

  # Tag push (vX.Y.Z or vX.Y.Z-rc.N): publish the zips, installers and SHA256SUMS as a GitHub
  # Release with build provenance. install.ps1 / install.sh download from it
  # ("releases/latest/download/<asset>", which skips -rc prereleases) and verify SHA256SUMS.
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, fxplug, lint, sync-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release / upload assets
      id-token: write       # sign the provenance attestation (Sigstore)
      attestations: write   # store it: gh attestation verify <file> -R anthonymendez/NTSCRT-Plugins
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches VERSION
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG doesn't match VERSION ($v): run scripts/release.py"; exit 1; }
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "::error::VERSION $v isn't X.Y.Z or X.Y.Z-rc.N"; exit 1; }
          case "$v" in *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          python3 scripts/release.py --notes "$TAG" > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect assets, write SHA256SUMS
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name 'NTSCRT-*.zip' -o -name 'NTSCRT-*.msi' -o -name 'NTSCRT-*.pkg' \) -exec cp {} release-assets/ \;
          cd release-assets
          ls -la
          [ -n "$(ls)" ] || { echo "::error::no NTSCRT-* artifacts"; exit 1; }
          sha256sum NTSCRT-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release-assets/SHA256SUMS
      # Idempotent: re-running the job (say after a failed upload) updates the existing release.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          files=(release-assets/*)
          printf 'asset: %s\n' "${files[@]}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists: replacing its assets and notes"
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --prerelease="$PRERELEASE"
          else
            pre=(); if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "NTSCRT $TAG" \
              --notes-file release-notes.md --verify-tag "${pre[@]}"
          fi
