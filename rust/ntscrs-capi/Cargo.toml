[package]
name = "ntscrs-capi"
version = "0.1.0"
edition = "2021"
description = "Minimal C ABI around the ntsc-rs core library (port of NTSCRT Vendor/ntscrs-capi)"
license = "MIT OR ISC OR Apache-2.0"

[lib]
name = "ntscrs_capi"
# Static library linked into ntscrt_core (OFX bundle, FxPlug service, CLI).
crate-type = ["staticlib"]

[dependencies]
ntsc-rs = { path = "../../vendor/ntsc-rs/crates/ntscrs" }
# The versions ntsc-rs itself uses (Cargo.lock): the GPU plan exports
# (src/gpu_plan.rs) reproduce its seeds and random rows with the same code.
rand = { version = "0.9.0", default-features = false }
rand_xoshiro = "0.7.0"
siphasher = "1.0.0"

[profile.release]
lto = true
codegen-units = 1

# Standalone crate — do not join any enclosing workspace.
[workspace]
